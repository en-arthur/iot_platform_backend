services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_iot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:54321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - AI_MODEL_PROVIDER=${AI_MODEL_PROVIDER:-openai}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-gpt-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-e2b}
      - E2B_API_KEY=${E2B_API_KEY}
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}
    depends_on:
      - mosquitto
    volumes:
      - ./backend/app:/app/app:ro

  # WorkersCraft AI Cloud Service (Multi-tenant app backend & JSONB storage)
  cloud_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn cloud_service.app.main:app --host 0.0.0.0 --port 8001
    container_name: workerscraft_cloud_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./cloudservice.db
      - JWT_SECRET=${JWT_SECRET:-workerscraft-jwt-secret-key-32chars}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000
    volumes:
      - ./backend/cloud_service:/app/cloud_service

  # Mosquitto MQTT Broker (Local message bus)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ai_iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:

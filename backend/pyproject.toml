[project]
name = "devicestack-backend"
version = "0.1.0"
description = "FastAPI Backend for DeviceStack Technologies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "email-validator",
    "pydantic-settings",
    "pyjwt[crypto]",
    "cryptography",
    "httpx",
    "supabase",
    "aiomqtt",
    "agno",
    "google-genai",
    "e2b",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

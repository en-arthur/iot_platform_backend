services:
  - type: web
    name: devicestack-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        value: https://your-project-ref.supabase.co
      - key: SUPABASE_ANON_KEY
        value: placeholder-supabase-anon-key
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: placeholder-supabase-service-role-key
      - key: SUPABASE_JWT_SECRET
        value: placeholder-supabase-jwt-secret
      - key: FRONTEND_URL
        value: https://your-frontend-domain.com
      - key: BACKEND_CORS_ORIGINS
        value: '["https://your-frontend-domain.com"]'
      - key: MQTT_BROKER_HOST
        value: devicestack-mosquitto  # will resolve to the mosquitto service
      - key: MQTT_BROKER_PORT
        value: "1883"
      - key: MQTT_ADMIN_USER
        value: admin
      - key: MQTT_ADMIN_PASSWORD
        sync: false
      - key: MQTT_USE_TLS
        value: "false"
      - key: AI_MODEL_PROVIDER
        value: gemini
      - key: AI_MODEL_NAME
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SANDBOX_PROVIDER
        value: e2b
      - key: E2B_API_KEY
        sync: false
      - key: WORKERSCRAFT_URL
        value: https://devicestack-cloud.onrender.com

  - type: web
    name: devicestack-mosquitto
    env: docker
    dockerfilePath: ./mosquitto/Dockerfile
    dockerContext: ./mosquitto
    plan: starter
    envVars:
      - key: MQTT_ADMIN_USER
        value: admin
      - key: MQTT_ADMIN_PASSWORD
        sync: false

  - type: web
    name: devicestack-cloud
    env: docker
    dockerfilePath: ./backend/cloud_service/Dockerfile
    dockerContext: ./backend/cloud_service
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devicestack-cloud-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: devicestack-cloud-db
    plan: starter

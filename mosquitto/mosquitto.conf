# =============================================================
# Mosquitto MQTT Broker - Production Config (Render)
# =============================================================

# Global auth (applies to all listeners)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# MQTT listener (port 1883)
listener 1883

# WebSockets listener (port 9001)
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all

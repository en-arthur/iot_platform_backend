# =============================================================
# Mosquitto MQTT Broker - Production Config (Render)
# =============================================================

# MQTT listener
listener 1883
allow_anonymous false

# Require username/password auth
password_file /mosquitto/config/passwd

# WebSockets listener (for browser dashboards)
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence (note: Render free tier has ephemeral disk)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
